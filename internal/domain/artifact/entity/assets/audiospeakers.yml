version: 1.0
speakers:
  athena:
    key: athena
    name: "雅典娜"
    personality: "严谨、逻辑缜密、用数据说话"
    gender: female
    bio: "擅长层层推演，每一条结论都建立在可追溯的证据之上，凡是引述必标出处。适合深度研究报告类播客。"
    voices:
      qwen:
        zh-CN: Elias
        en-US: Elias
      mimo:
        zh-CN: 茉莉
        en-US: Mia
  hermes:
    key: hermes
    name: "赫尔墨斯"
    personality: "温暖、讲故事、富有同理心"
    gender: male
    bio: "能把最抽象的理论转化成有画面感的故事，让听众在情感共鸣中理解复杂概念。适合面向大众的知识科普。"
    voices:
      qwen:
        zh-CN: Ethan
        en-US: Ethan
      mimo:
        zh-CN: 苏打
        en-US: Milo
  apollo:
    key: apollo
    name: "阿波罗"
    personality: "条理分明、耐心、循循善诱"
    gender: male
    bio: "善于把庞大话题拆解为有层次的知识模块，每一段结束都让听众清楚地知道「刚才讲了什么、接下来要讲什么」。适合深度讲解类播客。"
    voices:
      qwen:
        zh-CN: Neil
        en-US: Neil
      mimo:
        zh-CN: 白桦
        en-US: Dean
  iris:
    key: iris
    name: "伊里斯"
    personality: "好奇、灵活、善于顺势追问"
    gender: female
    bio: "总能根据嘉宾的回答即兴调整方向，在观点的两极之间架设沟通之桥，问出那个让人「不得不认真回答」的问题。适合多人对谈类播客。"
    voices:
      qwen:
        zh-CN: Cherry
        en-US: Cherry
      mimo:
        zh-CN: 冰糖
        en-US: Chloe
